# Windows 一体化客户端配置：所有业务数据保存在用户目录下的 H2 文件数据库中。
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: org.h2.Driver
    druid:
      master:
        url: jdbc:h2:file:${mtd.data-dir}/database/mtd;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE
        username: mtd
        password: mtd-local
      slave:
        enabled: false
      initialSize: 1
      minIdle: 1
      maxActive: 8
      maxWait: 10000
      connectTimeout: 10000
      socketTimeout: 30000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: false
      statViewServlet:
        enabled: false
  devtools:
    restart:
      enabled: false

mtd:
  desktop-mode: true
  local-cache: true

logging:
  file:
    name: ${mtd.data-dir}/logs/mtd-backend.log
  level:
    com.mtd: info
